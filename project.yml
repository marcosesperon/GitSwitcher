# Descripción del proyecto para XcodeGen. Para generar el .xcodeproj:
#   xcodegen generate
name: GitSwitcher
options:
  bundleIdPrefix: com.marcosesperon
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.2.3"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  GitSwitcher:
    type: application
    platform: macOS
    sources:
      - GitSwitcher
    info:
      path: GitSwitcher/Info.plist
      properties:
        CFBundleDisplayName: GitSwitcher
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es, fr, de, it, pt-BR, ja, zh-Hans, ko]
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSHumanReadableCopyright: "© 2026 Marcos Esperón. MIT License."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcosesperon.GitSwitcher
        PRODUCT_NAME: GitSwitcher
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: NO
  GitSwitcherTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - GitSwitcherTests
    dependencies:
      - target: GitSwitcher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcosesperon.GitSwitcherTests
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/GitSwitcher.app/Contents/MacOS/GitSwitcher
        GENERATE_INFOPLIST_FILE: YES
schemes:
  GitSwitcher:
    build:
      targets:
        GitSwitcher: all
        GitSwitcherTests: [test]
    test:
      targets:
        - GitSwitcherTests
